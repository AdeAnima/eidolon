[package]
name = "eidolon-cli"
description = "Report-only exact and near-duplicate media finder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "eidolon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
eidolon-core = { path = "../eidolon-core" }
eidolon-fetch = { path = "../eidolon-fetch" }
eidolon-image = { path = "../eidolon-image" }
eidolon-video = { path = "../eidolon-video" }
eidolon-text = { path = "../eidolon-text" }
indicatif = "0.18"
infer = "0.19"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"

[lints]
workspace = true
