[package]
name = "eidolon-image"
description = "Cached perceptual, neural and geometric near-duplicate image detection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
anyhow = "1"
bincode = "1.3"
eidolon-core = { path = "../eidolon-core" }
fast_image_resize = { version = "6.1", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
image_hasher = "3"
libheif-rs = { version = "2.7", features = ["image"] }
moxcms = "0.8"
opencv = { version = "0.101.1", default-features = false, features = ["clang-runtime", "geometry", "features", "imgproc"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
kamadak-exif = "0.6"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }

[dev-dependencies]
png = "0.18"
serde_json = "1"

[lints]
workspace = true
